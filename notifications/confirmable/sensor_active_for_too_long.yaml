blueprint:
  name: Confirmable Notification - Sensor active for too long
  description: >
    Sends a mobile notification reminding that
    a sensor has been active for too long.
  domain: automation
  input:
    target_entity:
      name: Target Sensor
      description: The binary sensor to monitor.
      selector:
        entity:
          domain:
          - binary_sensor
          multiple: false
    custom_friendly_name:
      name: Friendly Name
      description: |-
        The friendly name to use in the notification message.
        Leave empty to use the sensor's friendly name.
      default: ""
      selector:
        text: {}
    additional_conditions:
      name: Additional Conditions (Optional)
      description: Extra conditions that must be met for the notification to trigger.
      default: []
      selector:
        condition: {}
    ack_interval:
      name: Initial Notification After
      description: |-
        For how long must the sensor be active,
        initially or after an "ack,"
        before a notification is sent?
      default:
        minutes: 10
      selector:
        duration: {}
    nag_interval:
      name: Repeat Notifications After
      description: If ignored, how long to wait before sending another notification?
      default:
        minutes: 15
      selector:
        duration: {}
    notify_service:
      name: Notify Service
      description: The name of your mobile app notify service (e.g., notify.my_phone).
      default: notify.notify
      selector:
        text: {}
    critical_alert:
      name: Critical Alert Mode
      description: Bypass phone silent mode and Do Not Disturb?
      default: false
      selector:
        boolean: {}

mode: parallel
max: 5

variables:
  target_sensor: !input target_entity

  raw_name: !input custom_friendly_name
  friendly_name: "{{ raw_name if raw_name != '' else state_attr(target_device, 'friendly_name') }}"

  raw_ack: !input ack_interval
  primary_text: >-
    {%- if raw_ack is mapping -%}
      {%- set h = raw_ack.get('hours', 0) | int -%}
      {%- set m = raw_ack.get('minutes', 0) | int -%}
      {%- set s = raw_ack.get('seconds', 0) | int -%}
      {%- set time_str = [] -%}
      {%- if h > 0 %}{% set time_str = time_str + [h ~ 'h'] -%}{%- endif -%}
      {%- if m > 0 %}{% set time_str = time_str + [m ~ 'm'] -%}{%- endif -%}
      {%- if s > 0 %}{% set time_str = time_str + [s ~ 's'] -%}{%- endif -%}
      I'm on it! ({{ time_str | join(' ') }})
    {%- else -%}
      I'm on it! ({{ raw_ack }})
    {%- endif -%}

  raw_nag: !input nag_interval
  ignore_text: >-
    {%- if raw_nag is mapping -%}
      {%- set h = raw_nag.get('hours', 0) | int -%}
      {%- set m = raw_nag.get('minutes', 0) | int -%}
      {%- set s = raw_nag.get('seconds', 0) | int -%}
      {%- set time_str = [] -%}
      {%- if h > 0 %}{% set time_str = time_str + [h ~ 'h'] -%}{%- endif -%}
      {%- if m > 0 %}{% set time_str = time_str + [m ~ 'm'] -%}{%- endif -%}
      {%- if s > 0 %}{% set time_str = time_str + [s ~ 's'] -%}{%- endif -%}
      Ignore ({{ time_str | join(' ') }})
    {%- else -%}
      Ignore ({{ raw_nag }})
    {%- endif -%}

  uid: "{{ range(1000, 9999) | random }}{{ range(1000, 9999) | random }}"
  action_primary: "sensor_action_primary_{{ uid }}"
  action_ignore: "sensor_action_ignore_{{ uid }}"

  notification_tag: "{{ 'sensor_nag_' ~ target_sensor }}"
  is_critical: !input critical_alert

trigger:
- platform: state
  entity_id: !input target_entity
  to: "on"
  for: !input ack_interval

condition: !input additional_conditions

action:
- repeat:
    while:
    - condition: state
      entity_id: !input target_entity
      state: "on"
    sequence:
    - action: !input notify_service
      data:
        message: >-
          {{ friendly_name }} has been {{ state_translated(target_sensor) | lower }}
          for {{ relative_time(states[target_sensor].last_changed) }}.
        data: >-
          {%- set payload = {
            "tag": notification_tag,
            "notification_icon": state_attr(target_sensor, 'icon') or 'mdi:alert-circle',
            "actions": [
              { "action": action_primary, "title": primary_text },
              { "action": action_ignore, "title": ignore_text }
            ]
          } -%}
          {%- if is_critical -%}
            {%- set payload = dict(payload, **{
              "ttl": 0,
              "priority": "high",
              "push": {
                "sound": {
                  "name": "default",
                  "critical": 1,
                  "volume": 0.0
                }
              }
            }) -%}
          {%- endif -%}
          {{ payload }}
    - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_primary }}"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_ignore }}"
      - platform: state
        entity_id: !input target_entity
        to: "{{ states(target_sensor) != 'on' }}"
      timeout: !input nag_interval
      continue_on_timeout: true
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ wait.trigger != none and wait.trigger.platform == 'event' and wait.trigger.event.data.action == action_primary }}"
        sequence:
        - action: !input notify_service
          data:
            message: clear_notification
            data:
              tag: "{{ notification_tag }}"
        - wait_for_trigger:
          - platform: template
            value_template: "{{ states(target_sensor) != 'on' }}"
          timeout: !input ack_interval
      - conditions:
        - condition: template
          value_template: "{{ wait.trigger != none and wait.trigger.platform == 'event' and wait.trigger.event.data.action == action_ignore }}"
        sequence:
        - action: !input notify_service
          data:
            message: clear_notification
            data:
              tag: "{{ notification_tag }}"
        - wait_for_trigger:
          - platform: template
            value_template: "{{ states(target_sensor) != 'on' }}"
          timeout: !input nag_interval
      - conditions:
        - condition: template
          value_template: "{{ states(target_sensor) != 'on' }}"
        sequence:
        - action: !input notify_service
          data:
            message: clear_notification
            data:
              tag: "{{ notification_tag }}"
