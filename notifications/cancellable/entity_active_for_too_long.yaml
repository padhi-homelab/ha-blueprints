blueprint:
  name: Cancellable Notification - Entity active for too long
  description: >-
    Deactivates a device that has been active for too long,
    and sends a mobile notification to cancel.
  domain: automation
  input:
    target_entity:
      name: Target Device
      description: The cover, light, media player or switch to monitor.
      selector:
        entity:
          domain:
          - cover
          - light
          - media_player
          - switch
          multiple: false
    additional_conditions:
      name: Additional Conditions (Optional)
      description: Extra conditions that must be met for the notification to trigger.
      default: []
      selector:
        condition: {}
    ack_interval:
      name: First Notification After
      description: |-
        For how long must the device be in the monitored state
        before the first notification is sent?
      default:
        minutes: 10
      selector:
        duration: {}
    cancel_interval:
      name: Cancellation Timeout
      description: |-
        For how long must HomeAssistant wait for the "Cancel" button to be pressed,
        before automatically deactivating the target device?
      default:
        minutes: 1
      selector:
        duration: {}
    nag_interval:
      name: Repeat Notifications After
      description: If cancelled, how long to wait before sending another notification?
      default:
        minutes: 15
      selector:
        duration: {}
    notify_service:
      name: Notify Service
      description: The name of your mobile app notify service (e.g., notify.my_phone).
      default: notify.notify
      selector:
        text: {}
    critical_alert:
      name: Critical Alert Mode
      description: Bypass phone silent mode and Do Not Disturb?
      default: false
      selector:
        boolean: {}

mode: parallel
max: 5

variables:
  target_device: !input target_entity
  domain: "{{ target_device.split('.')[0] }}"

  device_state: >-
    {%- if domain in ['cover'] -%} open
    {%- elif domain == 'media_player' -%} playing
    {%- else -%} on {%- endif -%}

  primary_text: >-
    {%- if domain in ['cover'] -%} Close
    {%- elif domain == 'media_player' -%} Pause
    {%- else -%} Turn Off {%- endif -%}

  future_verb: >-
    {%- if domain in ['cover'] -%} Closing
    {%- elif domain == 'media_player' -%} Pausing
    {%- else -%} Turning Off {%- endif -%}

  past_verb: >-
    {%- if domain in ['cover'] -%} Closed
    {%- elif domain == 'media_player' -%} Paused
    {%- else -%} Turned Off {%- endif -%}

  raw_nag: !input nag_interval
  cancel_text: >-
    {%- if raw_nag is mapping -%}
      {%- set h = raw_nag.get('hours', 0) | int -%}
      {%- set m = raw_nag.get('minutes', 0) | int -%}
      {%- set s = raw_nag.get('seconds', 0) | int -%}
      {%- set time_str = [] -%}
      {%- if h > 0 %}{% set time_str = time_str + [h ~ 'h'] -%}{%- endif -%}
      {%- if m > 0 %}{% set time_str = time_str + [m ~ 'm'] -%}{%- endif -%}
      {%- if s > 0 %}{% set time_str = time_str + [s ~ 's'] -%}{%- endif -%}
      Cancel ({{ time_str | join(' ') }})
    {%- else -%}
      Cancel ({{ raw_nag }})
    {%- endif -%}

  raw_cancel: !input cancel_interval
  cancel_timeout_str: >-
    {% if raw_cancel is mapping %}
      {% set h = raw_cancel.get('hours', 0) | int %}
      {% set m = raw_cancel.get('minutes', 0) | int %}
      {% set s = raw_cancel.get('seconds', 0) | int %}
      {% set time_list = [] %}
      {% if h > 0 %}{% set time_list = time_list + [h ~ 'h'] %}{% endif %}
      {% if m > 0 %}{% set time_list = time_list + [m ~ 'm'] %}{% endif %}
      {% if s > 0 %}{% set time_list = time_list + [s ~ 's'] %}{% endif %}
      {{ time_list | join(' ') }}
    {% else %}
      {{ raw_cancel }}
    {% endif %}

  uid: "{{ range(1000, 9999) | random }}{{ range(1000, 9999) | random }}"
  action_ok: "entity_action_ok_{{ uid }}"
  action_cancel: "entity_action_cancel_{{ uid }}"

  notification_tag: "{{ 'cancel_entity_nag_' ~ target_device }}"
  is_critical: !input critical_alert

trigger:
- platform: state
  entity_id: !input target_entity
  to:
  - "on"
  - "open"
  - "playing"
  for: !input ack_interval

condition: !input additional_conditions

action:
- repeat:
    while:
    - condition: template
      value_template: "{{ states(target_device) == device_state }}"
    sequence:
    - action: !input notify_service
      data:
        message: >-
          {{ state_attr(target_device, 'friendly_name') }} has been
          {{ device_state }} for {{ relative_time(states[target_device].last_changed) }}.
          {{ future_verb }} in {{ cancel_timeout_str }}.
        data: >-
          {%- set payload = {
            "tag": notification_tag,
            "notification_icon": state_attr(target_device, 'icon') or 'mdi:alert-circle',
            "actions": [
              { "action": action_ok, "title": primary_text ~ " Now" },
              { "action": action_cancel, "title": cancel_text }
            ]
          } -%}
          {%- if is_critical -%}
            {%- set payload = dict(payload, **{
              "ttl": 0,
              "priority": "high",
              "push": {
                "sound": {
                  "name": "default",
                  "critical": 1,
                  "volume": 0.0
                }
              }
            }) -%}
          {%- endif -%}
          {{ payload }}
    - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_ok }}"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_cancel }}"
      - platform: state
        entity_id: !input target_entity
        to: "{{ states(target_device) != device_state }}"
      timeout: !input nag_interval
      continue_on_timeout: true
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ wait.trigger != none and wait.trigger.platform == 'event' and wait.trigger.event.data.action == action_cancel }}"
        sequence:
        - action: !input notify_service
          data:
            message: clear_notification
            data:
              tag: "{{ notification_tag }}"
        - wait_for_trigger:
          - platform: template
            value_template: "{{ states(target_device) != device_state }}"
          timeout: !input nag_interval
      - conditions:
        - condition: template
          value_template: "{{ states(target_device) != device_state }}"
        sequence:
        - action: !input notify_service
          data:
            message: clear_notification
            data:
              tag: "{{ notification_tag }}"
      default:
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ wait.trigger != none }}"
          sequence:
          - action: !input notify_service
            data:
              message: clear_notification
              data:
                tag: "{{ notification_tag }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ domain == 'cover' }}"
          sequence:
          - action: cover.close_cover
            target:
              entity_id: !input target_entity
        - conditions:
          - condition: template
            value_template: "{{ domain == 'media_player' }}"
          sequence:
          - action: media_player.media_pause
            target:
              entity_id: !input target_entity
        default:
        - action: homeassistant.turn_off
          target:
            entity_id: !input target_entity
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ wait.trigger == none }}"
          sequence:
          - action: !input notify_service
            data:
              message: >-
                {{ state_attr(target_device, 'friendly_name') }}
                was automatically {{ past_verb }}.
              data:
                tag: "{{ notification_tag }}"
                notification_icon: "state_attr(target_device, 'icon') or 'mdi:alert-circle'"
        default:
        - wait_for_trigger:
          - platform: template
            value_template: "{{ states(target_device) != device_state }}"
          timeout: !input ack_interval
